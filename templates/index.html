<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breast Cancer Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
        }

        .header {
            margin-bottom: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 8px;
        }

        /* Custom scrollbar styling */
        .grid-container::-webkit-scrollbar {
            width: 6px;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        #result-card {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .result-benign {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .result-malignant {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .result-error {
            background-color: #fff7ed;
            border: 1px solid #ffedd5;
            color: #9a3412;
        }

        .result-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Breast Cancer Diagnostics</h1>
        <p>Enter the 30 cell feature measurements below to run a prediction model.</p>
    </div>

    <div class="actions">
        <button type="button" class="btn-secondary" onclick="fillSampleData()">⚡ Auto-fill Sample Data</button>
    </div>

    <form id="prediction-form" onsubmit="handlePrediction(event)">
        <div class="grid-container" id="inputs-wrapper">
            <!-- 30 Inputs generated dynamically via JavaScript below -->
        </div>

        <button type="submit" class="btn-submit">Predict Diagnosis</button>
    </form>

    <div id="result-card">
        <div class="result-header" id="result-title"></div>
        <div id="result-details"></div>
    </div>
</div>

<script>
    // Column Names from Scikit-Learn Breast Cancer Dataset
    const featureNames = [
        "mean radius", "mean texture", "mean perimeter", "mean area", "mean smoothness",
        "mean compactness", "mean concavity", "mean concave points", "mean symmetry", "mean fractal dimension",
        "radius error", "texture error", "perimeter error", "area error", "smoothness error",
        "compactness error", "concavity error", "concave points error", "symmetry error", "fractal dimension error",
        "worst radius", "worst texture", "worst perimeter", "worst area", "worst smoothness",
        "worst compactness", "worst concavity", "worst concave points", "worst symmetry", "worst fractal dimension"
    ];

    // Sample data for quick testing
    const sampleValues = [
        17.99, 10.38, 122.8, 1001.0, 0.1184, 0.2776, 0.3001, 0.1471, 0.2419, 0.07871,
        1.095, 0.9053, 8.589, 153.4, 0.006399, 0.04904, 0.05373, 0.01587, 0.03003, 0.006193,
        25.38, 17.33, 184.6, 2019.0, 0.1622, 0.6656, 0.7119, 0.2654, 0.4601, 0.1189
    ];

    // Dynamically render inputs on page load
    const wrapper = document.getElementById('inputs-wrapper');
    featureNames.forEach((name, idx) => {
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
            <label for="feature_${idx}">${name}</label>
            <input type="number" step="any" id="feature_${idx}" placeholder="0.00" required>
        `;
        wrapper.appendChild(div);
    });

    // Populate all fields with test sample
    function fillSampleData() {
        sampleValues.forEach((val, idx) => {
            document.getElementById(`feature_${idx}`).value = val;
        });
    }

    // Submit form values to Flask backend
    async function handlePrediction(e) {
        e.preventDefault();
        const resultCard = document.getElementById('result-card');
        const resultTitle = document.getElementById('result-title');
        const resultDetails = document.getElementById('result-details');

        resultCard.style.display = 'none';

        // Extract input values from all 30 fields
        const features = [];
        for (let i = 0; i < 30; i++) {
            const value = parseFloat(document.getElementById(`feature_${i}`).value);
            features.push(value);
        }

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ features: features })
            });

            const data = await response.json();

            if (response.ok) {
                const isMalignant = data.prediction.toLowerCase().includes('malignant') || data.prediction === '1';
                
                resultCard.className = isMalignant ? 'result-malignant' : 'result-benign';
                resultTitle.innerText = `Prediction: ${data.prediction.toUpperCase()}`;
                resultDetails.innerText = `Model Confidence: ${(data.confidence * 100).toFixed(2)}%`;
            } else {
                resultCard.className = 'result-error';
                resultTitle.innerText = 'Error';
                resultDetails.innerText = data.error || 'Prediction failed.';
            }
        } catch (err) {
            resultCard.className = 'result-error';
            resultTitle.innerText = 'Network Error';
            resultDetails.innerText = err.message;
        }

        resultCard.style.display = 'block';
    }
</script>

</body>
</html>
